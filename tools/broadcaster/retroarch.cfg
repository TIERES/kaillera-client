# WE Camp broadcaster - RetroArch config (C:\broadcaster)
# No window, no sound card, no controllers: the game only goes out through
# the "wecamp" record driver (frames + audio -> ffmpeg -> YouTube).
video_driver = "null"
audio_driver = "null"
audio_enable = "true"
audio_sync = "false"
input_driver = "null"
input_joypad_driver = "null"
menu_driver = "rgui"
# Pace at the core's own fps with a timer (no monitor/vsync to lean on).
video_vsync = "false"
vrr_runloop_enable = "true"
# Catch-up to the kickoff (WECAMP_BROADCAST_FROM_FRAME): fast-forward with no cap.
fastforward_ratio = "0.0"
pause_nonactive = "false"
config_save_on_exit = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
history_list_enable = "true"
content_history_size = "20"
libretro_directory = ":\cores"
libretro_info_path = ":\info"
system_directory = ":\system"
rgui_config_directory = ":\config"
savefile_directory = ":\saves"
savestate_directory = ":\states"
content_history_path = ":\content_history.lpl"
core_options_path = ":\retroarch-core-options.cfg"
log_verbosity = "true"
frontend_log_level = "1"
libretro_log_level = "1"
