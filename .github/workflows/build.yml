name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - platform: x64
            arch_name: x64
            output_dir: x64/Release
          - platform: Win32
            arch_name: x86
            output_dir: Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          $env:revision = git describe --tags --always
          echo "GIT_REVISION=$env:revision" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.arch_name }} Release
        run: msbuild n02p.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v142 /p:WindowsTargetPlatformVersion=10.0 /p:ExtraDefines="GIT_REVISION=${{ env.GIT_REVISION }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kailleraclient-${{ matrix.arch_name }}-${{ env.GIT_REVISION }}
          path: ${{ matrix.output_dir }}/kailleraclient.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          # Zip each platform's DLL
          cd artifacts/kailleraclient-x64-${{ env.VERSION }}
          zip "../../release/kailleraclient-x64-${{ env.VERSION }}.zip" kailleraclient.dll
          cd ../..

          cd artifacts/kailleraclient-x86-${{ env.VERSION }}
          zip "../../release/kailleraclient-x86-${{ env.VERSION }}.zip" kailleraclient.dll
          cd ../..

          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
